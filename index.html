<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protec – Pedidos e Caixa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Figtree:wght@400;600&display=swap">
<style>
:root{color-scheme:dark;--bg:#000;--surf:#0A0A0B;--ink:#DDE0E4;--mut:#9BA0A6;--line:#3A3D42;--accent:#EE7F11;--on-accent:#0A0A0A;--in:#F2F4F6;--out:#EE7F11;--warn:#EE7F11;--chip:#16171A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:#000;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
.bg{position:fixed;inset:-60px;z-index:0;pointer-events:none;background:center 35%/min(140vw,1100px) auto no-repeat;filter:blur(12px);opacity:.4}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.5 Figtree,system-ui,sans-serif}
h1,h2,.num{font-family:"Chakra Petch",Figtree,system-ui,sans-serif}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:24px 18px 56px}
header{display:flex;justify-content:center;margin-bottom:8px}.logo{width:min(420px,85%);height:auto;display:block}.sr{position:absolute;left:-9999px}
h1{font-size:1.5rem;margin:0}
nav{display:flex;gap:6px;background:var(--chip);padding:4px;border-radius:12px;margin-bottom:18px}
nav button{flex:1;border:0;background:none;color:var(--mut);font:600 1.15rem Figtree,sans-serif;padding:14px;border-radius:9px;cursor:pointer}
nav button[aria-selected=true]{background:var(--accent);color:var(--on-accent)}
.panel{display:none}.panel.on{display:block}
.card{border-top:3px solid var(--accent);background:rgba(10,10,11,.8);border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:22px}
h2{font-size:1.35rem;margin:0 0 14px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
label{display:flex;flex-direction:column;gap:6px;font-size:.95rem;color:var(--mut)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:13px 14px;width:100%}
.full{grid-column:1/-1}
button.pri,button.sm{font:600 1.05rem Figtree,sans-serif;border-radius:9px;cursor:pointer;border:1px solid transparent}
button.pri{background:var(--accent);color:var(--on-accent);padding:14px 24px}
button.sm{background:var(--chip);color:var(--ink);padding:10px 15px;border-color:var(--line)}
button.ok{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
button.del{color:var(--out)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.stat{background:rgba(10,10,11,.8);border:1px solid var(--line);border-radius:14px;padding:20px}
.stat small{color:var(--mut);display:block}
.num{font-size:1.9rem;font-weight:700}
.balance{background:linear-gradient(135deg,#C9CDD2,#8C9198 55%,#B9BDC2);color:#0A0A0A;border-color:#B9BDC2}.balance_x{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.balance small{color:#1B1D20}.balance .num{color:#0A0A0A}
.balance .num{font-size:3rem}
.in{color:var(--in)}.out{color:var(--out)}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-of-type{border-top:0}
.row b{display:block}
.meta{color:var(--mut);font-size:1rem}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font-size:.9rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--chip)}
.tag.open{color:var(--warn)}.tag.done{color:var(--in)}
.filters{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.filters button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.empty{color:var(--mut);padding:14px 0}
.adm{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;color:var(--mut);font-size:.95rem}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden],input[hidden]{display:none}
.box{background:var(--surf);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:14px;padding:24px;width:min(440px,100%);display:grid;gap:12px}
.box h2,.box p{margin:0}.box .acts{justify-content:flex-end}
</style>
</head>

var brl=function(n){return n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var fd=function(d){if(!d)return"";var p=d.split("-");return p[2]+"/"+p[1]+"/"+p[0]};
var today=function(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};

function render(){
$("admSt").textContent=admin?"Modo administrador ativo":"Modo visitante";$("admBtn").textContent=admin?"Sair do modo administrador":"Entrar como administrador";
var open=S.orders.filter(function(o){return o.st==="open"});
$("sOpen").textContent=open.length;
$("sRec").textContent=brl(open.reduce(function(a,o){return a+o.val},0));
$("sDone").textContent=S.orders.length-open.length;
var list=S.orders.filter(function(o){return filter==="all"||o.st===filter}).slice().reverse();
$("ol").innerHTML=list.length?list.map(function(o){
return '<div class="row"><div><b>#'+o.n+' · '+esc(o.cli)+'</b><span>'+esc(o.desc)+'</span><div class="meta">'+(o.tel?esc(o.tel)+' · ':'')+(o.dt?'Entrega '+fd(o.dt)+' · ':'')+brl(o.val)+'</div></div><div class="acts"><span class="tag '+o.st+'">'+(o.st==="open"?"Em aberto":"Baixado")+'</span>'+
(o.st==="open"?'<button class="sm ok" data-a="done" data-id="'+o.id+'">Dar baixa</button>':(admin?'<button class="sm" data-a="reopen" data-id="'+o.id+'">Reabrir</button>':''))+
((o.st==="open"||admin)?'<button class="sm del" data-a="delo" data-id="'+o.id+'">Excluir</button>':'')+'</div></div>'}).join(""):'<p class="empty">Nenhum pedido aqui. Cadastre o primeiro no formulário acima.</p>';
var ti=0,to=0;S.tx.forEach(function(t){t.tp==="in"?ti+=t.val:to+=t.val});
$("tin").textContent=brl(ti);$("tout").textContent=brl(to);$("bal").textContent=brl(ti-to);
var tl=S.tx.slice().sort(function(a,b){return a.dt<b.dt?1:a.dt>b.dt?-1:0});
$("tl").innerHTML=tl.length?tl.map(function(t){
return '<div class="row"><div><b>'+esc(t.desc)+'</b><div class="meta">'+fd(t.dt)+'</div></div><div class="acts"><span class="num '+t.tp+'">'+(t.tp==="in"?"+ ":"− ")+brl(t.val)+'</span>'+(admin?'<button class="sm del" data-a="delt" data-id="'+t.id+'">Excluir</button>':'')+'</div></div>'}).join(""):'<p class="empty">Nenhuma movimentação. Registre uma entrada ou saída acima.</p>';
}

document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){
document.querySelectorAll("nav button").forEach(function(x){x.setAttribute("aria-selected",x===b)});
document.querySelectorAll(".panel").forEach(function(p){p.classList.toggle("on",p.id===b.dataset.p)})}});
$("flt").onclick=function(e){var f=e.target.dataset.f;if(!f)return;filter=f;
this.querySelectorAll("button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.f===f)});render()};

$("fo").onsubmit=function(e){e.preventDefault();var f=e.target;
S.orders.push({id:uid(),n:S.seq++,cli:f.cli.value.trim(),tel:f.tel.value.trim(),desc:f.desc.value.trim(),val:parseFloat(f.val.value)||0,dt:f.dt.value,st:"open"});
save();f.reset();render()};
$("ft").onsubmit=function(e){e.preventDefault();var f=e.target;
S.tx.push({id:uid(),tp:f.tp.value,val:parseFloat(f.val.value)||0,dt:f.dt.value,desc:f.desc.value.trim()});
save();f.reset();f.dt.value=today();render()};

document.body.addEventListener("click",async function(e){
var a=e.target.dataset&&e.target.dataset.a;if(!a)return;var id=e.target.dataset.id;
var o=S.orders.find(function(x){return x.id===id});
if(a==="done"&&o){o.st="done";S.tx.push({id:uid(),tp:"in",val:o.val,dt:today(),desc:"Pedido #"+o.n+" · "+o.cli,oid:o.id})}
else if(a==="reopen"&&o){if(!admin)return;o.st="open";S.tx=S.tx.filter(function(t){return t.oid!==o.id})}
else if(a==="delo"&&o){if(o.st==="done"&&!admin)return;if(!await ask({title:"Excluir pedido #"+o.n+"?",text:o.st==="done"?"A entrada gerada por ele no financeiro também será removida.":"Essa ação não pode ser desfeita.",ok:"Excluir"}))return;
S.orders=S.orders.filter(function(x){return x.id!==id});S.tx=S.tx.filter(function(t){return t.oid!==id})}
else if(a==="delt"){if(!admin)return;if(!await ask({title:"Excluir lançamento?",text:"Essa ação não pode ser desfeita.",ok:"Excluir"}))return;S.tx=S.tx.filter(function(t){return t.id!==id})}
save();render()});

var ADMK="pedidos-caixa-adm",admin=false;
try{admin=sessionStorage.getItem("adm")==="1"}catch(e){}
function h53(s){var a=0xdeadbeef,b=0x41c6ce57;for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return String(4294967296*(2097151&b)+(a>>>0))}
function setAdm(v){admin=v;try{sessionStorage.setItem("adm",v?"1":"0")}catch(e){}render()}
function ask(o){return new Promise(function(res){var m=$("md"),i1=$("mi"),i2=$("mi2");
$("mt").textContent=o.title;$("mp").textContent=o.text||"";$("me").textContent="";
i1.hidden=!o.pw;i2.hidden=o.pw!==2;i1.value="";i2.value="";$("mo").textContent=o.ok||"Confirmar";m.hidden=false;(o.pw?i1:$("mo")).focus();
function done(v){m.hidden=true;$("mo").onclick=null;$("mc").onclick=null;m.onkeydown=null;res(v)}
$("mc").onclick=function(){done(null)};
$("mo").onclick=function(){
if(o.pw&&!i1.value){$("me").textContent="Digite a senha.";return}
if(o.pw===2&&i1.value!==i2.value){$("me").textContent="As senhas não são iguais.";return}
if(o.check){var r=o.check(i1.value);if(r){$("me").textContent=r;return}}
done(o.pw?i1.value:true)};
m.onkeydown=function(e){if(e.key==="Escape")done(null);else if(e.key==="Enter")$("mo").click()}})}
$("admBtn").onclick=async function(){
if(admin){setAdm(false);return}
var st=null;try{st=localStorage.getItem(ADMK)}catch(e){}
if(!st){var r=await ask({title:"Criar senha de administrador",text:"Só quem souber esta senha poderá excluir lançamentos do financeiro.",pw:2,ok:"Criar e entrar",check:function(v){return v.length<4?"Use pelo menos 4 caracteres.":""}});
if(r){try{localStorage.setItem(ADMK,h53("pc"+r))}catch(e){}setAdm(true)}}
else{var r2=await ask({title:"Entrar como administrador",pw:1,ok:"Entrar",check:function(v){return h53("pc"+v)===st?"":"Senha incorreta."}});if(r2)setAdm(true)}};
$("clr").onclick=async function(){
var n=S.orders.filter(function(o){return o.st==="done"}).length;
if(!n){await ask({title:"Nada para zerar",text:"Não há pedidos baixados.",ok:"Ok"});return}
if(!await ask({title:"Zerar pedidos baixados?",text:n+" pedido(s) baixado(s) serão removidos da lista. As entradas já lançadas no financeiro continuam.",ok:"Zerar"}))return;
S.orders=S.orders.filter(function(o){return o.st!=="done"});S.tx.forEach(function(t){delete t.oid});save();render()};
$("ft").dt.value=today();
render();
</script>
</body>
</html>
